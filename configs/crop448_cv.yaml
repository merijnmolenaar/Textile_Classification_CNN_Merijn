# Task 3, change 1: native-resolution 448x448 crops (7.58 um/px kept) instead of resizing.
# Training: one random crop per image per epoch. Evaluation: 5x3 evenly spaced tiles per
# image (covers the whole 1920x1080 frame), tile probabilities averaged per image, then per sample.
# Same folds as resize448_cv (split_seed 42), so the two can be compared sample by sample.
name: crop448_cv
data: {mode: crop, img_size: 448, augment: false, eval_tiles: [5, 3], train_crops_per_image: 1}
split: {scheme: cv, n_folds: 5, val_frac: 0.15, split_seed: 42}
train: {lr: 1.0e-3, select_on: val_sample_acc, tune_threshold: true}

# Step 5: as crop448_ho_aug, plus rare-fibre oversampling (repeat factor sampling, Gupta et al. 2019).
# Class factor = clip(sqrt(f_cotton / f_class), 1, 5); a sample gets the largest factor of its fibres.
# Images are drawn with replacement in proportion to it; the epoch length stays the same, so
# training time and number of steps equal steps 3 and 4. Factors are logged in oversample.json.
name: crop448_ho_aug_os
data:
  mode: crop
  img_size: 448
  eval_tiles: [5, 3]
  train_crops_per_image: 1
  exclude_classes: [Peat fibre, Polyamide, Alpaca]
  augment: true
  aug: {rot90: true, rotation_deg: 0, brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.03, noise_std: 0}
split: {scheme: holdout, split_file: splits/holdout_70_15_15_v1.json}
train: {lr: 1.0e-3, select_on: val_sample_acc, tune_threshold: true, oversample: {power: 0.5, cap: 5}}
